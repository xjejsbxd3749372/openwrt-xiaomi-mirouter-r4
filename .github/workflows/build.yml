name: Build OpenWrt 19.07 (Xiaomi Mi Router 4)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-19.07
  CONFIG_FILE: config.seed
  DIY_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
          libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
          rsync subversion swig unzip wget xsltproc zlib1g-dev \
          curl ca-certificates tar make \
          java-propose-classpath

          cd /tmp
          curl -LO https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2 --enable-unicode=ucs4
          make -j"$(nproc)"
          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2

          python --version

      - name: Clone Source Code
        run: git clone -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Upgrade Go Language Environment
        working-directory: openwrt
        run: |
          git clone https://github.com/coolsnowwolf/packages/ ~/lean-packages
          
          # 首先，将OpenWRT 19.07现有的Golang配置文件夹改名
          mv ~/openwrt/feeds/packages/lang/golang/ ~/openwrt/feeds/packages/lang/golang.bak/

          # 然后，将L大package源中的Golang配置文件复制过来
          cp -r ~/lean-packages/lang/golang/ ~/openwrt/feeds/packages/lang/golang/

      - name: Load Custom Feeds & Add PassWall
        working-directory: openwrt
        run: |
          # 1. 注入官方 PassWall 源
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          
          ./scripts/feeds update -a
          
          # 🚀 【核心黑魔法】：强行修改 PassWall 的 Makefile，抹去 19.07 上绝不存在的强制依赖，防止被系统剔除
          sed -i 's/+kmod-inet-diag//g' feeds/passwall_packages/sing-box/Makefile || true
          sed -i 's/+kmod-inet-diag//g' feeds/passwall_packages/sing-box/Makefile || true
          sed -i 's/+kmod-netlink-diag//g' feeds/passwall_packages/sing-box/Makefile || true
          
          ./scripts/feeds install -a

      - name: Execute Custom Patch (diy-part2.sh)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/$DIY_SH"

      - name: Load Config Seed & Force Select PassWall
        working-directory: openwrt
        run: |
          # 1. 先复制你的基础配置种子
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
         
          # 2. 清理掉极度冲突且 128MB 路由器跑不动的包
          sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox/d' .config
          sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray/d' .config               
          
          # 3. 强制把轻量版 PassWall 及其组件打入配置文件的最底部
          cat <<EOF >> .config
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ChinaDNS_NG=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray-core=y
          EOF
          
          # 4. 执行 defconfig 自动补全
          make defconfig
          
          # 🔍 严格把关：在编译开始前，进行全自动化二次审查
          echo "=== 正在终极审查 PassWall 状态 ==="
          if grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config; then
              echo "✅ 审查成功：PassWall 已经牢固锁定在编译列表中！"
          else
              echo "❌ 审查失败：PassWall 又被系统依赖链强行冲刷掉了！"
              exit 1
          fi

      - name: Execute Custom Patch (diy-part2.sh)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/$DIY_SH"

      - name: Load Config Seed
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig
          # 严格验证您的 config.seed 目标设备 mir4 是否完美生效
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_mir4=y' .config \
            || { echo "::error::mir4 机型未被选中，请检查补丁脚本！"; exit 1; }

      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the Firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize & Collect Firmware
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/ramips/mt7621/*mir4* firmware/ || true
          cp openwrt/.config firmware/build.config
          ls -lh firmware

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-firmware
          path: firmware/*

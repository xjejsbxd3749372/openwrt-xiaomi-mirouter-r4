name: Build OpenWrt 19.07 (Xiaomi Mi Router 4)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-19.07
  CONFIG_FILE: config.seed
  DIY_SH: diy-part2.sh
  TZ: Asia/Shanghai
  FORCE_UNSAFE_CONFIGURE: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/graalvm
          df -h /

      - name: Add swap (Go 编 xray 防 OOM)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
            libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
            rsync subversion swig unzip wget xsltproc zlib1g-dev \
            curl ca-certificates tar make python3 python3-distutils \
            gcc-10 g++-10 flex bison gperf libtool pkg-config \
            libgmp-dev libmpc-dev libmpfr-dev unzip device-tree-compiler \
            python3-setuptools python3-dev quilt help2man
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          gcc --version

          if ! command -v python2 >/dev/null 2>&1; then
            sudo apt-get install -y python2 python2-dev || true
          fi
          if ! command -v python2 >/dev/null 2>&1; then
            cd /tmp
            curl -fL -o Python-2.7.18.tgz https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
            tar xf Python-2.7.18.tgz
            cd Python-2.7.18
            ./configure --prefix=/opt/python2 --enable-unicode=ucs4
            make -j"$(nproc)"
            sudo make install
            sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2
          fi
          sudo ln -sf "$(command -v python2 || echo /usr/bin/python2)" /usr/local/bin/python
          python --version || python2 --version

      - name: Clone Source Code
        run: git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Cache dl & ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/dl
          key: ${{ runner.os }}-openwrt-19.07-pw-${{ hashFiles('config.seed', 'diy-part2.sh') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-19.07-pw-
            ${{ runner.os }}-openwrt-19.07-

      - name: Add PassWall feeds (不要 kenzo/small，会和官方 Passwall 撞包)
        working-directory: openwrt
        run: |
          # 必须插在最上面，且 luci 仓库不能写成 packages
          sed -i '1i src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main' feeds.conf.default
          sed -i '2i src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main' feeds.conf.default
          cat feeds.conf.default

      - name: Update feeds, replace golang, drop stale packages
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a

          # 必须在 feeds update 之后换 Go，否则会被 19.07 自带的 1.13 覆盖
          rm -rf feeds/packages/lang/golang
          git clone --depth 1 -b 24.x https://github.com/sbwml/packages_lang_golang feeds/packages/lang/golang

          # 清掉官方 feeds 里过期/撞名的核心，用 passwall_packages
          rm -rf feeds/packages/net/xray-core \
                 feeds/packages/net/v2ray-core \
                 feeds/packages/net/v2ray-geodata \
                 feeds/packages/net/sing-box \
                 feeds/packages/net/chinadns-ng \
                 feeds/packages/net/dns2socks \
                 feeds/packages/net/hysteria \
                 feeds/packages/net/ipt2socks \
                 feeds/packages/net/microsocks \
                 feeds/packages/net/naiveproxy \
                 feeds/packages/net/shadowsocks-rust \
                 feeds/packages/net/shadowsocksr-libev \
                 feeds/packages/net/simple-obfs \
                 feeds/packages/net/tcping \
                 feeds/packages/net/v2ray-plugin \
                 feeds/packages/net/xray-plugin \
                 feeds/packages/net/geoview \
                 feeds/packages/net/shadow-tls \
                 feeds/luci/applications/luci-app-passwall || true

          ./scripts/feeds install -a

      - name: Execute Custom Patch (diy-part2.sh)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/$DIY_SH"

      - name: Load Config Seed & lock PassWall
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config

          # 清掉可能残留的错误 INCLUDE 名，再强制写入 19.07 能编过的选项
          sed -i '/CONFIG_PACKAGE_luci-app-passwall/d' .config

          cat >> .config <<'EOF'
CONFIG_CCACHE=y
CONFIG_PACKAGE_luci=y
CONFIG_LUCI_LANG_zh-cn=y
CONFIG_PACKAGE_luci-compat=y
CONFIG_PACKAGE_luci-lib-jsonc=y
CONFIG_PACKAGE_luci-app-passwall=y
CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
# CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy is not set
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Simple_Obfs=y
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Hysteria is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_NaiveProxy is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Haproxy is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Plugin is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray_Plugin is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Rust_Client is not set
# CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata is not set
CONFIG_PACKAGE_xray-core=y
CONFIG_PACKAGE_unzip=y
CONFIG_PACKAGE_chinadns-ng=y
CONFIG_PACKAGE_ipt2socks=y
CONFIG_PACKAGE_kmod-ipt-offload=y
EOF

          make defconfig

          echo "=== 审查配置 ==="
          grep -E 'CONFIG_TARGET_ramips_mt7621_DEVICE_mir4|CONFIG_PACKAGE_luci-app-passwall[=_]|CONFIG_PACKAGE_xray-core' .config | grep -v '^#' || true

          if grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_mir4=y' .config; then
            echo "✅ 机型：小米路由器 4 (mir4)"
          else
            echo "❌ 机型未选中"
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config; then
            echo "✅ PassWall 已锁定"
          else
            echo "❌ PassWall 仍被依赖链冲掉，dump 相关行："
            grep -n 'passwall\|lyaml\|iptables-zz\|iptables-mod-socket\|luci-compat' .config || true
            exit 1
          fi

          if grep -q '^CONFIG_PACKAGE_xray-core=y' .config; then
            echo "✅ xray-core 已锁定"
          else
            echo "❌ xray-core 未选中"
            exit 1
          fi

      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the Firmware
        working-directory: openwrt
        env:
          GOPROXY: https://proxy.golang.org,direct
        run: |
          make tools/ccache/compile -j"$(nproc)" || true
          ./staging_dir/host/bin/ccache -M 10G || true
          make -j"$(nproc)" CONFIG_CCACHE=y || make -j1 V=s CONFIG_CCACHE=y

      - name: Organize & Collect Firmware
        run: |
          mkdir -p firmware
          cp -v openwrt/bin/targets/ramips/mt7621/*mir4* firmware/ || true
          cp -v openwrt/.config firmware/build.config
          find openwrt/bin/packages -name '*passwall*' -o -name '*xray-core*' | xargs -r cp -t firmware/ || true
          ls -lh firmware

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-passwall
          path: firmware/*
          if-no-files-found: error

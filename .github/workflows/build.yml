name: Build OpenWrt 19.07 (Xiaomi Mi Router 4)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-19.07
  CONFIG_FILE: config.seed
  DIY_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git \
            libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python3 python-is-python3 \
            python3-distutils python3-setuptools rsync subversion swig unzip wget xsltproc zlib1g-dev \
            java-propose-classpath

      - name: Clone Source Code
        run: git clone --depth 1 -b "$REPO_BRANCH" "$REPO_URL" openwrt

      - name: Load Custom Feeds & Add PassWall
        working-directory: openwrt
        run: |
          # 写入真实的、兼容旧版 OpenWrt 环境的 PassWall 及其附属依赖库网址
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Execute Custom Patch (diy-part2.sh)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/$DIY_SH"

      - name: Load Config Seed
        working-directory: openwrt
        run: |
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
          make defconfig
          # 严格验证您的 config.seed 目标设备 mir4 是否完美生效
          grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_mir4=y' .config \
            || { echo "::error::mir4 机型未被选中，请检查补丁脚本！"; exit 1; }

      - name: Download Packages
        working-directory: openwrt
        run: |
          make download -j8
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the Firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Organize & Collect Firmware
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/ramips/mt7621/*mir4* firmware/ || true
          cp openwrt/.config firmware/build.config
          ls -lh firmware

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-firmware
          path: firmware/*

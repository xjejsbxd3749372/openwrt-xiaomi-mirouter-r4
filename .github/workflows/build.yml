name: Build OpenWrt 19.07 (Xiaomi Mi Router 4)

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-19.07
  CONFIG_FILE: config.seed
  DIY_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential ccache ecj fastjar file g++ gawk gettext git \
          libelf-dev libncurses5-dev libncursesw5-dev libssl-dev \
          libbz2-dev libreadline-dev libsqlite3-dev libffi-dev \
          rsync subversion swig unzip wget xsltproc zlib1g-dev \
          curl ca-certificates tar make \
          java-propose-classpath

          cd /tmp
          curl -LO https://python.org
          tar xf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --prefix=/opt/python2 --enable-unicode=ucs4
          make -j"$(nproc)"
          sudo make install

          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python
          sudo ln -sf /opt/python2/bin/python2.7 /usr/local/bin/python2

          python --version

      - name: Clone Source Code
        run: git clone -b "$REPO_BRANCH" "$REPO_URL" openwrt

      # ✨ 新增：官方推荐的缓存机制，缓存下载的源码包(dl)和编译缓存(ccache)
      - name: Cache Build Tools & Ccache
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/dl
          key: ${{ runner.os }}-openwrt-19.07-${{ hashFiles('openwrt/feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-19.07-

      - name: Upgrade Go Language Environment
        working-directory: openwrt
        run: |
          # 修正克隆路径：克隆 Lean 的 packages 库 [1]
          git clone --depth 1 https://github.com/coolsnowwolf/packages/ ../lean-packages
          
          # 修正原脚本中的路径错误（当前目录是 openwrt，因此直接操作 feeds/） [1]
          rm -rf feeds/packages/lang/golang/
          cp -r ../lean-packages/lang/golang/ feeds/packages/lang/golang/

      - name: Load Custom Feeds & Add PassWall
        working-directory: openwrt
        run: |

          sed -i '1i src-git kenzo https://github.com/kenzok8/openwrt-packages' feeds.conf.default
          sed -i '2i src-git small https://github.com/kenzok8/small' feeds.conf.default
          
          # 1. 注入官方 PassWall 源（修正了原脚本中两行地址一模一样的笔误） [1]
          echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default
          echo "src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main" >> feeds.conf.default

          git pull
          ./scripts/feeds update -a
          
          # 🚀 修改 PassWall 的 Makefile，抹去 19.07 上不存在的强制依赖，防止被系统剔除 [1]
          sed -i 's/+kmod-inet-diag//g' feeds/passwall_packages/sing-box/Makefile || true
          sed -i 's/+kmod-netlink-diag//g' feeds/passwall_packages/sing-box/Makefile || true
          
          ./scripts/feeds install -a

      - name: Execute Custom Patch (diy-part2.sh)
        working-directory: openwrt
        run: bash "$GITHUB_WORKSPACE/$DIY_SH"

      # 🔥 核心修正：合并了原脚本中相互覆盖的三个配置生成步骤 [1]
      - name: Load Config Seed & Double Verify
        working-directory: openwrt
        run: |
          # 1. 先复制你的基础配置种子 [1]
          cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
         
          # 2. 清理掉极度冲突且 128MB 路由器跑不动的包 [1]
          sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox/d' .config
          sed -i '/CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray/d' .config               
          
          # 3. 强制把轻量版 PassWall 及其组件打入配置文件的最底部 [1]
          cat <<EOF >> .config
          CONFIG_PACKAGE_luci=y
          CONFIG_LUCI_LANG_zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Shadowsocks_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Libev_Client=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ChinaDNS_NG=y
          CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray-core=y
          CONFIG_CCACHE=y
          EOF
          
          # 4. 执行唯一一次 defconfig 自动补齐 [1]
          make defconfig
          
          # 🔍 严格把关：同时审查 PassWall 状态和目标机型 [1]
          echo "=== 正在终极审查配置状态 ==="
          
          # 验证机型是否选中 [1]
          if grep -q '^CONFIG_TARGET_ramips_mt7621_DEVICE_mir4=y' .config; then
              echo "✅ 机型审查成功：小米路由器 4 (mir4) 已正确选中！"
          else
              echo "❌ 机型审查失败：小米路由器 4 (mir4) 未被选中，请检查 config.seed！"
              exit 1
          fi

          # 验证 PassWall 是否锁定 [1]
          if grep -q '^CONFIG_PACKAGE_luci-app-passwall=y' .config; then
              echo "✅ 插件审查成功：PassWall 已经牢固锁定在编译列表中！"
          else
              echo "❌ 插件审查失败：PassWall 又被系统依赖链强行冲刷掉了！"
              exit 1
          fi

      - name: Download Packages
        working-directory: openwrt
        run: |
          # 开启动态全线程下载 [1]
          make download -j$(nproc)
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile the Firmware
        working-directory: openwrt
        run: |
          # 1. 优先编译并安装 openwrt 自带的 ccache 宿主机工具
          make tools/ccache/compile -j$(nproc)
          
          # 2. 设置 ccache 最大缓存空间
          ./staging_dir/host/bin/ccache -M 10G || true
          
          # 3. 动态全线程编译（如果报错退回单线程打印详细日志） [1]
          make -j$(nproc) CONFIG_CCACHE=y || make -j1 V=s CONFIG_CCACHE=y

      - name: Organize & Collect Firmware
        run: |
          mkdir -p firmware
          cp openwrt/bin/targets/ramips/mt7621/*mir4* firmware/ || true
          cp openwrt/.config firmware/build.config
          ls -lh firmware

      - name: Upload Firmware Directory
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-mir4-firmware
          path: firmware/*
